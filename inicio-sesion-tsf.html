    .pagina::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        linear-gradient(180deg, #191a1dfb 0%, #202125ed 23%, #2526298a 42%, #17191c1c 62%, #131416ce 100%),
        linear-gradient(90deg, #121416bb 0%, #12141655 44%, #17191d19 78%);
      pointer-events: none;
    }
    .encabezado {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: clamp(23px, 3.1vw, 48px) clamp(28px, 5.2vw, 100px) 0;
    }
    .logo { line-height: 1; display: inline-block; text-decoration: none; color: white; }
    .logo-grande {
      display: block;
      font-size: clamp(39px, 4.35vw, 65px);
      font-weight: 950;
      letter-spacing: -2.8px;
    }
    .logo-grande b { color: var(--amarillo); }
    .logo-sub {
      font-size: clamp(8px, .84vw, 12px);
      letter-spacing: 3.6px;
      display: block;
      margin-top: 5px;
      color: #e0e1e4;
      font-weight: 400;
    }
    .linea-superior {
      height: 3px;
      width: clamp(70px, 9vw, 130px);
      background: var(--amarillo);
      border-radius: 999px;
      align-self: flex-start;
      margin-top: 18px;
    }
    .contenido {
      width: 100%;
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(340px, 440px);
      align-items: center;
      column-gap: clamp(35px, 5.5vw, 100px);
      padding: 28px clamp(28px, 5.2vw, 100px) 125px;
      max-width: 1920px;
      margin: 0 auto;
    }
    .introduccion {
      align-self: start;
      padding-top: clamp(53px, 9vh, 115px);
      max-width: 760px;
    }
    .introduccion h1 {
      font-size: clamp(40px, 4.55vw, 78px);
      font-weight: 370;
      line-height: 1.08;
      letter-spacing: -2.1px;
      margin: 0;
      text-wrap: balance;
      text-shadow: 0 3px 20px #00000030;
    }
    .introduccion h1 strong {
      display: block;
      color: var(--amarillo);
      font-weight: 800;
      letter-spacing: -2.4px;
    }
    .bajada {
      font-size: clamp(15px, 1.45vw, 21px);
      color: #f3f4f6;
      margin: 21px 0 0;
      line-height: 1.55;
      max-width: 650px;
      text-shadow: 0 2px 14px #0008;
    }
    .acento {
      display: block;
      width: 72px;
      height: 4px;
      border-radius: 10px;
      background: var(--amarillo);
      margin-top: 27px;
    }
    .tarjeta {
      width: 100%;
      padding: clamp(28px, 3.6vw, 49px);
      background: #fff;
      border: 1px solid #ffffffa6;
      border-radius: 22px;
      box-shadow: 0 24px 80px #00000056;
      color: var(--negro);
      z-index: 1;
    }
    .tarjeta h2 {
      margin: 0 0 27px;
      font-size: clamp(24px, 2.1vw, 32px);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -.7px;
    }
    .campo { margin-top: 20px; }
    .campo label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #272d37;
      margin-bottom: 10px;
    }
    .entrada {
      position: relative;
      display: flex;
      align-items: center;
      height: 54px;
      border-radius: 10px;
      border: 1.5px solid var(--borde);
      background: #fbfcfd;
      transition: border-color .2s, box-shadow .2s;
    }
    .entrada:focus-within {
      border-color: #b48a00;
      box-shadow: 0 0 0 3px #ffd95e42;
    }
    .entrada svg { width: 20px; height: 20px; flex: 0 0 20px; margin-left: 17px; color: #303847; }
    .entrada select, .entrada input {
      width: 100%;
      min-width: 0;
      flex: 1;
      height: 100%;
      outline: 0;
      border: 0;
      background: transparent;
      color: #202734;
      padding: 0 13px;
      font-size: 14px;
    }
    .entrada select { appearance: none; padding-right: 35px; cursor: pointer; }
    .entrada select:invalid { color: #7a8391; }
    .flecha-select {
      position: absolute;
      right: 17px;
      top: calc(50% - 5px);
      width: 9px;
      height: 9px;
      border-right: 2px solid #283241;
      border-bottom: 2px solid #283241;
      transform: rotate(45deg);
      pointer-events: none;
    }
    .entrada input::placeholder { color: #8992a0; }
    .mostrar {
      width: 45px;
      height: 50px;
      border: 0;
      background: transparent;
      display: grid;
      place-items: center;
      color: #425063;
    }
    .mostrar svg { margin: 0; }
    .mostrar:hover { color: #101828; }
    .entrar {
      width: 100%;
      height: 59px;
      margin-top: 33px;
      border: 0;
      border-radius: 11px;
      background: var(--amarillo);
      color: #151619;
      font-size: 16px;
      font-weight: 850;
      box-shadow: 0 8px 20px #e8b70035;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: background .2s, transform .2s;
    }
    .entrar:not(:disabled):hover { background: var(--amarillo-hover); transform: translateY(-1px); }
    .entrar:disabled { opacity: .72; cursor: wait; }
    .entrar svg { width: 19px; height: 19px; }
    .error {
      min-height: 19px;
      margin: 14px 0 0;
      font-size: 12px;
      line-height: 1.4;
      color: #a1202f;
      text-align: center;
    }
    .pie-tarjeta { margin-top: 18px; text-align: center; color: #78818d; font-size: 11px; }
    .atributos {
      position: absolute;
      left: clamp(28px, 5.2vw, 100px);
      bottom: clamp(30px, 5vh, 57px);
      display: flex;
      align-items: center;
      gap: 25px;
      max-width: calc(100% - 550px);
    }
    .atributo { display: flex; align-items: center; gap: 12px; color: #fff; font-size: 13px; font-weight: 600; line-height: 1.35; white-space: nowrap; text-shadow: 0 1px 10px #000a; }
    .atributo-icono { display: grid; place-items: center; width: 48px; height: 48px; border: 1.5px solid var(--amarillo); border-radius: 11px; background: #1112167a; flex: 0 0 auto; }
    .atributo-icono svg { height: 25px; width: 25px; stroke: #fff; }
    .separador { height: 33px; width: 1px; background: #ffffff75; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    @media (min-width: 1600px) { .contenido { padding-bottom: 140px; } .foto-flota { inset: 34% 0 0; } }
    @media (max-width: 1140px) {
      .contenido { grid-template-columns: minmax(0,1fr) 390px; gap: 20px; }
      .introduccion h1 { font-size: clamp(37px,4.4vw,56px); }
      .tarjeta { padding: 30px; }
      .atributos { gap: 13px; }
      .atributo { font-size: 11px; }
      .atributo-icono { width: 40px; height: 40px; }
    }
    @media (max-width: 850px) {
      .pagina { overflow: visible; }
      .foto-flota { inset: 26% 0 37%; background-position: 38% center; }
      .pagina::before { background: linear-gradient(180deg,#17191df5 0%,#17191dc9 23%,#17191d58 47%,#17191df0 72%,#17191d 100%); }
      .contenido { grid-template-columns: 1fr; gap: 32px; padding-bottom: 36px; }
      .introduccion { padding-top: 18px; max-width: 650px; }
      .introduccion h1 { font-size: clamp(40px,7vw,62px); }
      .tarjeta { max-width: 530px; justify-self: center; margin-top: 40px; }
      .atributos { position: static; max-width: none; flex-wrap: wrap; margin: 0 auto; padding: 0 30px 32px; justify-content: center; }
    }
    @media (max-width: 520px) {
      .encabezado { padding: 23px 22px 0; }
      .logo-grande { font-size: 42px; }
      .linea-superior { width: 52px; margin-top: 12px; }
      .contenido { padding: 22px 17px 29px; }
      .introduccion { padding: 25px 6px 0; }
      .introduccion h1 { font-size: clamp(34px,9vw,47px); letter-spacing: -1.4px; }
      .introduccion h1 strong { letter-spacing: -1.6px; }
      .bajada { font-size: 14px; max-width: 285px; }
      .acento { margin-top: 18px; }
      .tarjeta { margin-top: 105px; padding: 25px 22px; border-radius: 17px; }
      .tarjeta h2 { margin-bottom: 19px; }
      .atributos { gap: 11px; padding: 0 12px 22px; }
      .atributo { font-size: 10px; gap: 5px; }
      .atributo-icono { width: 33px; height: 33px; border-radius: 8px; }
      .atributo-icono svg { width: 18px; height: 18px; }
      .separador { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <div class="pagina">
    <div class="foto-flota" aria-hidden="true"></div>
    <header class="encabezado">
      <div class="logo" aria-label="TOTAL Servicios Financieros">
        <span class="logo-grande">TOTAL<b>!</b></span>
        <span class="logo-sub">servicios financieros</span>
      </div>
      <span class="linea-superior" aria-hidden="true"></span>
    </header>

    <main class="contenido">
      <section class="introduccion" aria-label="Portal de Operaciones">
        <h1>Portal de Operaciones <strong>Mediano Plazo</strong></h1>
        <p class="bajada">Leasing que impulsa el crecimiento de tu empresa.</p>
        <span class="acento" aria-hidden="true"></span>
      </section>

      <section class="tarjeta" aria-labelledby="titulo-login">
        <h2 id="titulo-login">Iniciar sesión</h2>
        <form id="form-login">
          <div class="campo">
            <label for="rol">Tipo de acceso</label>
            <div class="entrada">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
              <select id="rol" required aria-label="Tipo de acceso">
                <option value="" selected disabled>Selecciona tu tipo de acceso</option>
                <option value="LECTURA">Consulta</option>
                <option value="EDICION">Edición</option>
              </select>
              <span class="flecha-select" aria-hidden="true"></span>
            </div>
          </div>
          <div class="campo">
            <label for="password">Contraseña</label>
            <div class="entrada">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              <input id="password" name="password" type="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required />
              <button class="mostrar" type="button" id="mostrar" aria-label="Mostrar contraseña" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button class="entrar" type="submit" id="boton-ingresar">
            <span id="texto-boton">Ingresar al portal</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
          </button>
          <p class="error" id="estado" role="alert" aria-live="polite"></p>
        </form>
        <p class="pie-tarjeta">Acceso exclusivo para personal autorizado</p>
      </section>
    </main>

    <footer class="atributos" aria-label="Características del portal">
      <div class="atributo">
        <span class="atributo-icono"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path d="M4 20V12h4v8M10 20V8h4v12M16 20V4h4v16M2 20h20"/></svg></span>
        <span>Control<br>en tiempo real</span>
      </div>
      <span class="separador" aria-hidden="true"></span>
      <div class="atributo">
        <span class="atributo-icono"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linejoin="round"><path d="M6 2h9l4 4v16H6zM15 2v5h4M9 12h7M9 16h7"/></svg></span>
        <span>Gestión<br>centralizada</span>
      </div>
      <span class="separador" aria-hidden="true"></span>
      <div class="atributo">
        <span class="atributo-icono"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linejoin="round"><path d="M12 2 20 5v6c0 6-3 9-8 11-5-2-8-5-8-11V5z"/><path d="m8 12 3 3 5-6"/></svg></span>
        <span>Operación<br>confiable</span>
      </div>
    </footer>
  </div>

  <script>
    "use strict";
    // Mantiene la autenticación del portal TSF que ya está operativa.
    const API = "https://tsf-operaciones-api-prueba.jchavez-23e.workers.dev";
    const DESTINO = "./gestion-operaciones.html";
    const form = document.getElementById("form-login");
    const boton = document.getElementById("boton-ingresar");
    const textoBoton = document.getElementById("texto-boton");
    const estado = document.getElementById("estado");
    const passwordInput = document.getElementById("password");
    const mostrar = document.getElementById("mostrar");

    mostrar.addEventListener("click", () => {
      const visible = passwordInput.type === "password";
      passwordInput.type = visible ? "text" : "password";
      mostrar.setAttribute("aria-pressed", String(visible));
      mostrar.setAttribute("aria-label", visible ? "Ocultar contraseña" : "Mostrar contraseña");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const rol = document.getElementById("rol").value;
      const password = passwordInput.value;
      if (!["LECTURA", "EDICION"].includes(rol) || !password) return;

      boton.disabled = true;
      textoBoton.textContent = "Validando acceso...";
      estado.textContent = "";

      try {
        const respuesta = await fetch(API + "/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ rol, password }),
          credentials: "omit",
          cache: "no-store"
        });
        const datos = await respuesta.json();
        if (!respuesta.ok || datos.ok !== true || !datos.access_token) {
          throw new Error(datos.error || "No se pudo iniciar sesión");
        }

        const verificacion = await fetch(API + "/auth/me", {
          method: "GET",
          headers: { "Authorization": "Bearer " + datos.access_token },
          credentials: "omit",
          cache: "no-store"
        });
        const sesion = await verificacion.json();
        if (!verificacion.ok || sesion.ok !== true || sesion.rol !== rol) {
          throw new Error("No se pudo verificar la sesión");
        }

        sessionStorage.setItem("TSF_PILOTO_TOKEN", datos.access_token);
        sessionStorage.setItem("TSF_PILOTO_ROL", sesion.rol);
        passwordInput.value = "";
        window.location.assign(DESTINO);
      } catch (error) {
        estado.textContent = error instanceof TypeError
          ? "No fue posible conectar con el servicio de acceso."
          : (error?.message || "No se pudo iniciar sesión.");
        passwordInput.value = "";
        boton.disabled = false;
        textoBoton.textContent = "Ingresar al portal";
      }
    });
  </script>
</body>
</html>
