<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17181b">
<title>TOTAL! | Portal de Operaciones Mediano Plazo</title>
<style>
:root{
  --carbon:#191b1e;
  --amarillo:#ffca05;
  --blanco:#fff;
  --gris:#68717e;
  --borde:#d7dce4;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Segoe UI",Arial,sans-serif}
body{background:var(--carbon);color:var(--blanco);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button{cursor:pointer}
.pagina{
  position:relative;
  isolation:isolate;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#18191b;
}
/* Una sola foto panorámica a toda pantalla: sin franjas ni recortes internos. */
.fondo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:50% 50%;
  z-index:-3;
}
/* Veladura ligera que permite leer el texto sin oscurecer la flota. */
.pagina::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:
    linear-gradient(90deg,
      rgba(16,17,20,.84) 0%,
      rgba(16,17,20,.71) 23%,
      rgba(16,17,20,.40) 43%,
      rgba(16,17,20,.10) 64%,
      rgba(16,17,20,.16) 100%),
    linear-gradient(180deg,
      rgba(15,16,19,.49) 0%,
      rgba(15,16,19,.03) 38%,
      rgba(15,16,19,.12) 71%,
      rgba(15,16,19,.82) 100%);
}
.encabezado{
  width:100%;
  max-width:1920px;
  margin:0 auto;
  padding:clamp(30px,3.5vw,56px) clamp(28px,5vw,94px) 0;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}
.logo{display:inline-flex;flex-direction:column;line-height:1;color:white}
.logo-marca{font-size:clamp(41px,4.1vw,64px);font-weight:950;letter-spacing:-2.7px}
.logo-marca b{color:var(--amarillo)}
.logo-sub{font-size:clamp(8px,.8vw,11px);letter-spacing:3.2px;color:#eff0f2;margin-top:3px}
.acento-superior{width:105px;height:3px;margin-top:18px;background:var(--amarillo);border-radius:3px}
.contenido{
  flex:1;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(350px,455px);
  align-items:center;
  column-gap:clamp(28px,5.5vw,108px);
  width:100%;max-width:1920px;
  margin:0 auto;
  padding:25px clamp(28px,5vw,94px) 20px;
}
.mensaje{align-self:center;max-width:860px;margin-bottom:100px}
.mensaje h1{
  margin:0;
  font-size:clamp(43px,4.5vw,72px);
  font-weight:380;
  letter-spacing:-2px;
  line-height:1.06;
  text-wrap:balance;
  text-shadow:0 3px 16px #0006;
}
.mensaje h1 strong{display:block;color:var(--amarillo);font-weight:820;letter-spacing:-2.2px}
.mensaje p{font-size:clamp(16px,1.35vw,21px);line-height:1.5;margin:20px 0 0;color:#f3f3f3;text-shadow:0 1px 7px #0008}
.linea{width:70px;height:4px;background:var(--amarillo);border-radius:4px;margin-top:27px}
.tarjeta{
  width:100%;
  padding:44px 42px 36px;
  color:#1b2028;
  background:rgba(255,255,255,.985);
  border:1px solid #fff;
  border-radius:21px;
  box-shadow:0 27px 84px #0008;
  margin-bottom:35px;
}
.tarjeta h2{font-size:29px;letter-spacing:-.8px;line-height:1.1;margin:0 0 30px;font-weight:800}
.campo{margin-top:22px}
.campo label{display:block;margin-bottom:10px;font-size:13px;font-weight:750;color:#303541}
.entrada{
  position:relative;display:flex;align-items:center;
  width:100%;height:54px;
  background:#fbfcfe;border:1.5px solid var(--borde);border-radius:10px;
  transition:border-color .18s,box-shadow .18s;
}
.entrada:focus-within{border-color:#a78200;box-shadow:0 0 0 3px #ffca0533}
.entrada>svg{width:20px;height:20px;flex-shrink:0;margin-left:15px;color:#414b59}
.entrada input,.entrada select{
  outline:none;border:0;background:transparent;color:#232a36;
  height:100%;flex:1;min-width:0;width:100%;padding:0 12px;font-size:14px;
}
.entrada input::placeholder{color:#798594}
.entrada select{appearance:none;cursor:pointer;padding-right:30px}
.entrada select:invalid{color:#798594}
.flecha-select{position:absolute;right:17px;top:calc(50% - 5px);width:9px;height:9px;transform:rotate(45deg);border-bottom:2px solid #343d4a;border-right:2px solid #343d4a;pointer-events:none}
.mostrar{display:grid;place-items:center;flex:0 0 45px;height:100%;border:0;background:none;color:#364352}
.mostrar svg{width:19px;height:19px}
.mostrar:hover{color:#000}
.entrar{
  display:flex;align-items:center;justify-content:center;gap:12px;
  margin-top:32px;width:100%;min-height:58px;border:0;border-radius:10px;
  background:var(--amarillo);color:#17191e;font-weight:850;font-size:16px;
  box-shadow:0 12px 25px #bc94002e;transition:transform .18s,background .18s;
}
.entrar svg{width:18px;height:18px}
.entrar:not(:disabled):hover{background:#ffdb3e;transform:translateY(-1px)}
.entrar:disabled{opacity:.75;cursor:wait}
.error{min-height:18px;margin:13px 0 0;color:#ab2630;text-align:center;font-size:12px;line-height:1.45}
.aviso{font-size:11px;text-align:center;color:#8b929c;margin:10px 0 0}
.atributos{
  position:relative;
  display:flex;align-items:center;gap:23px;
  width:100%;max-width:1920px;
  padding:0 clamp(28px,5vw,94px) clamp(26px,4vh,48px);
  margin:0 auto;
}
.atributo{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:640;line-height:1.35;text-shadow:0 1px 9px #000e}
.icono{width:45px;height:45px;display:grid;place-items:center;flex:0 0 auto;border:1px solid var(--amarillo);border-radius:10px;background:#0b0d1099}
.icono svg{width:24px;height:24px;stroke:#fff}
.separador{width:1px;height:29px;background:#ffffff73}
@media(max-width:1040px){
  .contenido{grid-template-columns:minmax(0,1fr) minmax(325px,385px);column-gap:24px}
  .mensaje h1{font-size:clamp(40px,4.65vw,58px)}
  .tarjeta{padding:33px 27px}
}
@media(max-width:780px){
  .pagina{overflow:visible}
  .fondo{object-position:58% 48%}
  .pagina::before{background:linear-gradient(180deg,#18191de8 0%,#191a1c75 30%,#18191cbd 61%,#18191cf5 100%)}
  .contenido{display:flex;flex-direction:column;align-items:stretch;gap:35px;padding-bottom:22px}
  .mensaje{align-self:stretch;margin:20px 0 0}
  .mensaje h1{font-size:clamp(37px,6.8vw,60px)}
  .tarjeta{max-width:510px;margin:25px auto 10px}
  .atributos{justify-content:center;flex-wrap:wrap;gap:15px}
}
@media(max-width:490px){
  .encabezado{padding:22px 22px 0}
  .logo-marca{font-size:42px}.logo-sub{font-size:8px;letter-spacing:2.5px}
  .acento-superior{width:55px;margin-top:17px}
  .contenido{padding:30px 18px 20px}
  .mensaje{margin:14px 0 0}
  .mensaje h1{font-size:clamp(34px,9vw,46px);letter-spacing:-1.45px}
  .mensaje h1 strong{letter-spacing:-1.6px}
  .mensaje p{font-size:14px;margin-top:15px}
  .linea{margin-top:18px;width:53px}
  .tarjeta{margin:30px auto 0;padding:27px 23px;border-radius:16px}
  .tarjeta h2{font-size:25px;margin-bottom:24px}
  .atributos{padding:18px 10px 24px;gap:13px}
  .atributo{font-size:10px;gap:6px}
  .icono{width:34px;height:34px;border-radius:8px}
  .icono svg{width:19px;height:19px}
  .separador{display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>

        <div class="campo">
          <label for="rol">Tipo de acceso</label>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>

              <option value="" disabled selected>Selecciona tu tipo de acceso</option>
              <option value="LECTURA">Consulta</option>
              <option value="EDICION">Edición</option>
            </select>
            <span class="flecha-select" aria-hidden="true"></span>

        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <div class="entrada">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input id="password" type="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
            <button id="mostrar" class="mostrar" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>

<script>
"use strict";
// Esta pantalla mantiene exactamente la conexión de autenticación TSF.
const API = "https://tsf-operaciones-api-prueba.jchavez-23e.workers.dev";
const DESTINO = "./gestion-operaciones.html";
const form = document.getElementById("form-login");
const boton = document.getElementById("boton-ingresar");
const textoBoton = document.getElementById("texto-boton");
const estado = document.getElementById("estado");
const passwordInput = document.getElementById("password");
const mostrar = document.getElementById("mostrar");

mostrar.addEventListener("click", () => {
  const visible = passwordInput.type === "password";
  passwordInput.type = visible ? "text" : "password";
  mostrar.setAttribute("aria-pressed", String(visible));
  mostrar.setAttribute("aria-label", visible ? "Ocultar contraseña" : "Mostrar contraseña");
});

form.addEventListener("submit", async event => {
  event.preventDefault();
  const rol = document.getElementById("rol").value;
  const password = passwordInput.value;
  if (!["LECTURA", "EDICION"].includes(rol) || !password) return;

  boton.disabled = true;
  textoBoton.textContent = "Validando acceso...";
  estado.textContent = "";

  try {
    const respuesta = await fetch(API + "/auth/login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({rol, password}),
      credentials: "omit",
      cache: "no-store"
    });
    const datos = await respuesta.json();
    if (!respuesta.ok || datos.ok !== true || !datos.access_token) {
      throw new Error(datos.error || "No se pudo iniciar sesión");
    }

    const verificacion = await fetch(API + "/auth/me", {
      method: "GET",
      headers: {Authorization: "Bearer " + datos.access_token},
      credentials: "omit",
      cache: "no-store"
    });
    const sesion = await verificacion.json();
    if (!verificacion.ok || sesion.ok !== true || sesion.rol !== rol) {
      throw new Error("No se pudo verificar la sesión");
    }
    sessionStorage.setItem("TSF_PILOTO_TOKEN", datos.access_token);
    sessionStorage.setItem("TSF_PILOTO_ROL", sesion.rol);
    passwordInput.value = "";
    window.location.assign(DESTINO);
  } catch (error) {
    estado.textContent = error instanceof TypeError
      ? "No fue posible conectar con el servicio de acceso."
      : (error?.message || "No se pudo iniciar sesión.");
    passwordInput.value = "";
    boton.disabled = false;
    textoBoton.textContent = "Ingresar al portal";
  }
});
</script>
