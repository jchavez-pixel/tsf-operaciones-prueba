
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>TSF - Prueba de conexión API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      padding: 40px;
      text-align: center;
    }
    .panel {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 520px;
      margin: auto;
      border-top: 5px solid #ffcb16;
    }
    h2 { color: #20242a; }
    #estado { font-weight: bold; }
    pre {
      text-align: left;
      background: #f3f4f6;
      padding: 15px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h2>TSF - Portal de Operaciones</h2>
    <p>Prueba GitHub Pages + Cloudflare</p>
    <p id="estado">Comprobando conexión...</p>
    <pre id="resultado"></pre>
  </div>

  <script>
    const API =
      "https://tsf-operaciones-api-prueba.jchavez-23e.workers.dev/health";

    async function probarConexion() {
      const estado = document.getElementById("estado");
      const resultado = document.getElementById("resultado");

      try {
        const respuesta = await fetch(API, {
          method: "GET",
          mode: "cors",
          cache: "no-store"
        });

        if (!respuesta.ok) {
          throw new Error("HTTP " + respuesta.status);
        }

        const datos = await respuesta.json();

        if (datos.ok !== true) {
          throw new Error("API no disponible");
        }

        estado.textContent = "CONEXIÓN EXITOSA";
        estado.style.color = "green";
        resultado.textContent =
          JSON.stringify(datos, null, 2);

      } catch (error) {
        estado.textContent = "ERROR DE CONEXIÓN";
        estado.style.color = "red";
        resultado.textContent = error.message;
      }
    }

    probarConexion();
  </script>
</body>
</html>
