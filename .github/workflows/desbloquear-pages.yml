
name: Desbloquear GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  desbloquear:
    runs-on: ubuntu-latest

    steps:
      - name: Cancelar publicacion 114
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -i -X POST \
            "repos/jchavez-pixel/tsf-operaciones-prueba/pages/deployments/1523f19e6ff15ad4545798a654496ac575ce3f57/cancel"
